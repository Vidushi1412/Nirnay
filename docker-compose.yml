version: "3.9"

services:

  # ── Main Streamlit app ──
  nirnay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirnay_app
    image: nirnay:latest
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount for live code reloading during development
      # Comment out in production
      - ./utils:/app/utils:ro
      - ./pages:/app/pages:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Optional: Nginx reverse proxy for production ──
  # Uncomment to serve behind nginx with a custom domain
  # nginx:
  #   image: nginx:alpine
  #   container_name: nirnay_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - nirnay
  #   restart: unless-stopped
